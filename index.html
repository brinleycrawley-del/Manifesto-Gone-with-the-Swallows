  </header>
    <div class="stanza">
        <div class="line" style="--i:1">Never shall I forget today--</div>
        <div class="line" style="--i:2">My heart having stolen away,</div>
        <div class="line" style="--i:3">And all the blooming flowers</div>
        <div class="line" style="--i:4">That reared at such odd</div>
        <div class="line" style="--i:5">hours</div>
        <div class="line" style="--i:6">And crowned him with the</div>
        <div class="line" style="--i:7">showers</div>
        <div class="line" style="--i:8">Of all the springs of May</div>
