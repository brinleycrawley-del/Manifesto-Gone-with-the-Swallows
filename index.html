<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Gone with the Swallows</title>

  <style>
    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      color: black;
      justify-content: center;
      line-spacing: 20px;
    }

    h1 {
      text-align: center;
      color: #2f3134;
      font-weight: bold;
      opacity: 0.8;
    
    h2 {
      text-align: center;
      color: #2f3134;
      font-weight: bold;
      letter-spacing: 50px;
      line-height: 20px;
      margin-top: -80px;
      margin-bottom: -80px;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    div {
      font-size: 30px;
      letter-spacing: 35px;
      opacity: 0.5;
      line-height: 1.4;
      text-align: center;
      padding-top: 10px;
      margin-top: 10px;
      padding-bottom: 10px;
    }
  </style>
</head>

<body>
    <h1>Gone with the Swallows</h1>
    <div class="stanza">
        <div class="line" style="--i:1">Must I forget the day</div>
        <div class="line" style="--i:2">That took my love away,</div>
        <div class="line" style="--i:3">And all the happy hours</div>
        <div class="line" style="--i:4">That reared for him their</div>
        <div class="line" style="--i:5">towers</div>
        <div class="line" style="--i:6">And crowned him with the</div>
        <div class="line" style="--i:7">flowers</div>
        <div class="line" style="--i:8">Of all the queens of May?</div>

</body>

</html>
